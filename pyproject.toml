[project]
name = "amph_text_gate"
version = "0.1.0"
description = "OCR band + corner marks"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow"]

[project.scripts]
amph-text-gate = "text:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["text"]
